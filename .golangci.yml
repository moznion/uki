version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bidichk
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - noctx
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      # Terminal output; a failed write has no meaningful recovery.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Tests drive git/ssh-keygen against throwaway fixtures they create.
      - path: (_test\.go$|^internal/testutil/)
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/moznion/uki
