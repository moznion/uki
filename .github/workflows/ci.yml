# Runs tests and lint on GitHub Actions, independently of uki records.
#
# Triggers:
# - Push to main (including merges).
# - Pull requests opened by tagpr (head branch `tagpr-from-*`).
# - Pull requests that change anything under .github/workflows/.
#
# Other pull requests rely on the `uki` commit status instead; for them the
# jobs below are skipped (a skipped job satisfies a required check).
#
# NOTE: pull requests created with the default GITHUB_TOKEN do not trigger
# workflows, so tagpr must run with TAGPR_TOKEN (see tagpr.yml) for this to fire
# on its pull requests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          run=false
          if [ "$EVENT" = push ]; then
            run=true
          elif [[ "$HEAD_REF" == tagpr-from-* ]]; then
            run=true
          elif gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' \
              | grep -q '^\.github/workflows/'; then
            run=true
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  lint:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
