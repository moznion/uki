name: tagpr

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tagpr
  cancel-in-progress: false

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: Songmu/tagpr@v1.22.0
        env:
          # Pull requests created with the default GITHUB_TOKEN do not trigger
          # other workflows, so ci.yml would not run on tagpr's pull requests.
          # Set TAGPR_TOKEN (a PAT or GitHub App token with contents and
          # pull-requests write) to enable that.
          GITHUB_TOKEN: ${{ secrets.TAGPR_TOKEN || secrets.GITHUB_TOKEN }}
